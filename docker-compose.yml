version: '3.8'

networks:
  enterprise-net:
    driver: bridge

services:
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - enterprise-net
    depends_on:
      - grafana
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    networks:
      - enterprise-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    networks:
      - enterprise-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  enterprise-node-1:
    image: python:3.11-slim
    container_name: enterprise-node-1
    command: python -m http.server 8080
    networks:
      - enterprise-net
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

  enterprise-node-2:
    image: python:3.11-slim
    container_name: enterprise-node-2
    command: python -m http.server 8080
    networks:
      - enterprise-net
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

  loki:
    image: grafana/loki:latest
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - enterprise-net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - enterprise-net
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 128M

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - enterprise-net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
