services:
  enterprise-node-1:
    image: python:3.10-slim
    container_name: enterprise-node-1
    command: sleep infinity
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M
    networks:
      - enterprise-net

  enterprise-node-2:
    image: python:3.10-slim
    container_name: enterprise-node-2
    command: sleep infinity
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M
    networks:
      - enterprise-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - enterprise-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - enterprise-net

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - grafana
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M
    networks:
      - enterprise-net

networks:
  enterprise-net:
    driver: bridge
