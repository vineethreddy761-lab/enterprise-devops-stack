version: '3.8'

services:
  enterprise-node-1:
    image: python:3.10-slim
    container_name: enterprise-node-1
    command: sleep infinity
    networks:
      - enterprise-net

  enterprise-node-2:
    image: python:3.10-slim
    container_name: enterprise-node-2
    command: sleep infinity
    networks:
      - enterprise-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - enterprise-net

networks:
  enterprise-net:
    driver: bridge
